name: 'Playwright Setup on Runner'
description: 'Setup Playwright on Runner: Node, cached node_modules, cached browsers'
inputs:
    caching-dependencies:
        description: 'Whether to cache dependencies or not'
        required: false
        default: 'true'
    caching-browsers:
        description: 'Whether to cache browsers or not'
        required: false
        default: 'true'
runs:
    using: 'composite'
    steps:
        - name: Setup Node (with npm cache)
          uses: actions/setup-node@v4
          with:
              node-version: lts/*
              cache: 'npm'

        - name: Cache node_modules
          if: inputs.caching-dependencies == 'true'
          id: cache-dependencies
          uses: actions/cache@v4
          with:
              path: node_modules
              key: deps-node-modules-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
              restore-keys: |
                  deps-node-modules-${{ runner.os }}-

        - name: Install dependencies
          if: steps.cache-dependencies.outputs.cache-hit != 'true' || inputs.caching-dependencies != 'true'
          run: npm ci --no-audit --no-fund
          shell: bash
          env:
              HUSKY: '0'

        - name: Cache Playwright Browsers
          if: inputs.caching-browsers == 'true'
          id: cache-browsers
          uses: actions/cache@v4
          with:
              path: ~/.cache/ms-playwright
              key: playwright-browsers-${{ runner.os }}

        - name: Install Playwright Browsers
          if: inputs.caching-browsers == 'true' && steps.cache-browsers.outputs.cache-hit != 'true'
          run: npx playwright install --with-deps chromium
          shell: bash